</style></head><body><a class="skip-link" href="#main">跳到正文</a><div class="page-frame"><main id="main" tabindex="-1"><header class="page-heading" data-astro-cid-s7fn5vct><div class="section-heading" data-astro-cid-s7fn5vct><h1 data-astro-cid-s7fn5vct><span class="section-marker" aria-hidden="true" data-astro-cid-s7fn5vct>//</span>片段</h1><span class="quote-count" data-astro-cid-pjfmndpu>共 19 则</span></div><p data-astro-cid-s7fn5vct>这里留下一些记住的话和生活里的片段，有些是提醒，有些是回忆。</p></header><div class="quotes-list" data-astro-cid-pjfmndpu><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>01</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>我想回家了。</p></blockquote><figcaption data-astro-cid-pjfmndpu>Shuai<span data-astro-cid-pjfmndpu>2026-03</span></figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>02</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>思考全面、持续学习、用技术解决真问题。</p></blockquote><figcaption data-astro-cid-pjfmndpu><a href="https://baoyu.io/translations/2026/01/12/next-two-years-software-engineering" data-astro-cid-pjfmndpu>软件工程的未来两年</a><span data-astro-cid-pjfmndpu>2026-03</span></figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>03</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>犯错的人不会沉浸在错误里，而是继续战斗。</p></blockquote><figcaption data-astro-cid-pjfmndpu>管泽元 S12 总决赛 2-2<span data-astro-cid-pjfmndpu>2022-11</span></figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>04</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>优秀工程师的生产力至少是普通工程师的 10 倍，这并不是因为优秀的工程师写代码的速度快了 10 倍，而是因为他们做出的决策（设计）可以节省 10 倍的工作量。</p></blockquote><figcaption data-astro-cid-pjfmndpu><a href="https://knowledge.csc.gov.sg/ethos-issue-21/how-to-build-good-software/" data-astro-cid-pjfmndpu>How to Build Good Software</a></figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>05</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>在颁奖礼上，@罗翔说刑法 的致辞感动了无数人：&quot;我不过用我的视频拨动了大家的心弦，大家被自己心中的正义感所感动，将不配有的荣光投射给我。&quot;</p></blockquote><figcaption data-astro-cid-pjfmndpu>BILIBILI<span data-astro-cid-pjfmndpu>2022-01</span></figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>06</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>功夫要下在平常。</p></blockquote><figcaption data-astro-cid-pjfmndpu>Benco<span data-astro-cid-pjfmndpu>2021-04</span></figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>07</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>平台的增长、正向反馈。从不可或缺，走向下一个不可或缺。</p></blockquote><figcaption data-astro-cid-pjfmndpu>Benco<span data-astro-cid-pjfmndpu>2020-11</span></figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>08</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>重铸 LCK 的荣光，我辈义不容辞。</p></blockquote><figcaption data-astro-cid-pjfmndpu>ShowMaker<span data-astro-cid-pjfmndpu>2020-10</span></figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>09</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>职业生涯时是场马拉松。一定可以。</p></blockquote><figcaption data-astro-cid-pjfmndpu>Jammy</figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>10</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>无论我们发现了什么，考虑到当时的已知情况、个人的技术水平和能力、可用的资源、以及手上的状况，我们理解并坚信：每个人对自己的工作都已全力以赴。</p></blockquote><figcaption data-astro-cid-pjfmndpu>迭代回顾会分享</figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>11</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>珍惜眼前人。</p></blockquote><figcaption data-astro-cid-pjfmndpu>MLXG<span data-astro-cid-pjfmndpu>2019-10-20</span></figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>12</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>希望姐夫可以挣大钱，常带我姐回家。</p></blockquote><figcaption data-astro-cid-pjfmndpu>Ni<span data-astro-cid-pjfmndpu>2019-09-07</span></figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>13</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>没有神的光环，握紧手中的平凡。</p></blockquote><figcaption data-astro-cid-pjfmndpu>只要平凡</figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>14</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>博客名为&quot;不立不破&quot;。不轻谈建立和打破，世界上有太多的问题都是源自于&quot;看的书太少而想的太多&quot;。</p></blockquote><figcaption data-astro-cid-pjfmndpu><a href="https://github.com/kxxoling/blog" data-astro-cid-pjfmndpu>kxxoling/blog</a></figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>15</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>在微信&quot;盲约&quot;。</p></blockquote><figcaption data-astro-cid-pjfmndpu>深圳培训</figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>16</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>只了解方便面，便做不了满汉全席。</p></blockquote><figcaption data-astro-cid-pjfmndpu>贝壳面试</figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>17</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>挤时间，要比想清楚自己的目标，容易太多。</p></blockquote></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>18</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>成为规则的指定者。</p></blockquote><figcaption data-astro-cid-pjfmndpu>Cong</figcaption></figure><figure class="quote-entry" data-astro-cid-pjfmndpu><span class="quote-number" aria-hidden="true" data-astro-cid-pjfmndpu>19</span><blockquote data-astro-cid-pjfmndpu><p data-astro-cid-pjfmndpu>公司发展可以掩盖很多问题。</p></blockquote><figcaption data-astro-cid-pjfmndpu>John</figcaption></figure></div></main><footer class="site-footer"><div class="footer-columns"><div class="footer-identity"><div class="footer-attribution"><p class="footer-copyright">© 2026 Yifans_Z</p><p class="footer-credit">主题设计灵感来自 <a href="https://cali.so/">Cali</a>。</p></div><div class="footer-details"><div class="footer-clock"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 5v7l-4 3" stroke-linecap="round"></path></svg><div><span>UTC+8</span><time id="local-clock"></time></div></div><div class="footer-location" aria-label="纬度 40.020000， 经度 116.373333，网格定位 ON80ea"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><ellipse cx="12" cy="12" rx="5" ry="10"></ellipse><path d="M2 12h20M4 6.5h16M4 17.5h16"></path></svg><div><span>40.0200° N</span><span>116.3733° E</span><span class="footer-grid">ON80ea</span></div></div></div></div><div cla
